version: '3.9'

services:
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"  # SonarQube por defecto usa el puerto 9000
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
  database:
    image: mysql:8.0
    container_name: db_bankaya
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 4dm1n1str4d0r
      MYSQL_DATABASE: bankaya_db
      MYSQL_USER: app_bankaya
      MYSQL_PASSWORD: b4nk4y4
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
#	  - ./sql-scripts:/docker-entrypoint-initdb.d

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_bankaya
    restart: always
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/bankaya_db
      SPRING_DATASOURCE_USERNAME: app_bankaya
      SPRING_DATASOURCE_PASSWORD: b4nk4y4
    ports:
      - "8080:8080"

volumes:
  db_data:
